<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">A double click and a money split, before and after</title>
<desc id="d">Without the skill: two clicks on Buy with one item left both read one left and both sell, so stock goes to minus one and one customer gets nothing; splitting $100.00 three ways gives 33.33 three times, 99.99, and a cent is lost. With the skill: each click runs one atomic UPDATE where stock is above zero, the first sells and the second gets sold out, and a retry gives the same order; the split is 33.34 plus 33.33 plus 33.33, exactly 100.00, in integer cents and one transaction.</desc>
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .flow{stroke-dasharray:16 984;animation:flow 2.4s linear infinite}
  .lost{stroke-dasharray:22 978;animation:flow 7s linear infinite}
  @keyframes flow{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.2,1) backwards}
  @keyframes grow{from{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){.flow,.lost{animation:none;stroke-dasharray:none;opacity:0}.grow{animation:none}}</style>
<rect width="1200" height="560" rx="20" fill="#0d1117"/>

<rect x="20" y="20" width="570" height="520" rx="16" fill="#161b22" stroke="#30363d"/>
<circle cx="50" cy="51" r="5" fill="#f85149"/>
<text x="64" y="56" class="s" font-size="12" font-weight="700" fill="#f85149" text-anchor="start" letter-spacing="1.6">WITHOUT THE SKILL</text>
<text x="44" y="88" class="s" font-size="21" font-weight="700" fill="#e6edf3" text-anchor="start">Double click, double trouble.</text>
<rect x="610" y="20" width="570" height="520" rx="16" fill="#161b22" stroke="#30363d"/>
<circle cx="640" cy="51" r="5" fill="#3fb950"/>
<text x="654" y="56" class="s" font-size="12" font-weight="700" fill="#3fb950" text-anchor="start" letter-spacing="1.6">WITH THE SKILL</text>
<text x="634" y="88" class="s" font-size="21" font-weight="700" fill="#e6edf3" text-anchor="start">Click twice, sell once. Cents add up.</text><circle cx="600" cy="280" r="17" fill="#0d1117" stroke="#30363d"/><path d="M593 280h13m-5-5 5 5-5 5" fill="none" stroke="#e6edf3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="132" class="s" font-size="13" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="1.2">TWO CLICKS ON BUY · 1 LEFT IN STOCK</text>
<text x="44" y="172" class="s" font-size="13" font-weight="600" fill="#8b949e" text-anchor="start">click 1</text><rect x="108" y="150" width="120" height="34" rx="8" fill="#21262d" stroke="#30363d"/><text x="168" y="172" class="m" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">read: 1 left</text><path d="M232 167h14m-5-5 5 5-5 5" fill="none" stroke="#8b949e" stroke-width="1.6"/><rect x="252" y="150" width="60" height="34" rx="8" fill="#21262d" stroke="#30363d"/><text x="282" y="172" class="m" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">sell</text><path d="M316 167h14m-5-5 5 5-5 5" fill="none" stroke="#8b949e" stroke-width="1.6"/><rect x="336" y="150" width="84" height="34" rx="8" fill="#21262d" stroke="#30363d"/><text x="378" y="172" class="m" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">stock 0</text>
<text x="44" y="220" class="s" font-size="13" font-weight="600" fill="#8b949e" text-anchor="start">click 2</text><rect x="108" y="198" width="120" height="34" rx="8" fill="#21262d" stroke="#30363d"/><text x="168" y="220" class="m" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">read: 1 left</text><path d="M232 215h14m-5-5 5 5-5 5" fill="none" stroke="#8b949e" stroke-width="1.6"/><rect x="252" y="198" width="60" height="34" rx="8" fill="#21262d" stroke="#30363d"/><text x="282" y="220" class="m" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">sell</text><path d="M316 215h14m-5-5 5 5-5 5" fill="none" stroke="#8b949e" stroke-width="1.6"/><rect x="336" y="198" width="84" height="34" rx="8" fill="#2d1517" stroke="#8e2c2a"/><text x="378" y="220" class="m" font-size="13" font-weight="700" fill="#ffa198" text-anchor="middle">stock −1</text>
<g><rect x="44" y="257" width="313.525" height="26" rx="13" fill="#2d1517" stroke="#8e2c2a"/><text x="55" y="274.68" class="s" font-size="13" font-weight="600" fill="#ffa198" text-anchor="start">✕ sold twice: one customer gets nothing</text></g>
<text x="44" y="336" class="s" font-size="13" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="1.2">SPLIT $100.00 THREE WAYS</text>
<circle cx="76" cy="396" r="31" fill="#21262d" stroke="#30363d" stroke-width="2"/><text x="76" y="401" class="m" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">33.33</text><text x="121" y="402" class="s" font-size="18" font-weight="400" fill="#8b949e" text-anchor="middle">+</text><circle cx="166" cy="396" r="31" fill="#21262d" stroke="#30363d" stroke-width="2"/><text x="166" y="401" class="m" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">33.33</text><text x="211" y="402" class="s" font-size="18" font-weight="400" fill="#8b949e" text-anchor="middle">+</text><circle cx="256" cy="396" r="31" fill="#21262d" stroke="#30363d" stroke-width="2"/><text x="256" y="401" class="m" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">33.33</text><text x="329" y="402" class="s" font-size="18" font-weight="400" fill="#8b949e" text-anchor="middle">=</text><circle cx="380" cy="396" r="31" fill="#2d1517" stroke="#8e2c2a" stroke-width="2"/><text x="380" y="401" class="m" font-size="14" font-weight="700" fill="#ffa198" text-anchor="middle">99.99</text><g><rect x="424" y="383.5" width="111.69999999999999" height="25" rx="12.5" fill="#2d1517" stroke="#8e2c2a"/><text x="435" y="400.32" class="s" font-size="12" font-weight="600" fill="#ffa198" text-anchor="start">✕ 1¢ vanished</text></g>
<g><rect x="44" y="463" width="119.175" height="26" rx="13" fill="#2d1517" stroke="#8e2c2a"/><text x="55" y="480.68" class="s" font-size="13" font-weight="600" fill="#ffa198" text-anchor="start">✕ float money</text></g><g><rect x="173.175" y="463" width="141.6" height="26" rx="13" fill="#2d1517" stroke="#8e2c2a"/><text x="184.175" y="480.68" class="s" font-size="13" font-weight="600" fill="#ffa198" text-anchor="start">✕ no transaction</text></g>
<text x="634" y="132" class="s" font-size="13" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="1.2">TWO CLICKS ON BUY · 1 LEFT IN STOCK</text>
<text x="634" y="172" class="s" font-size="13" font-weight="600" fill="#8b949e" text-anchor="start">click 1</text><rect x="698" y="150" width="212" height="34" rx="8" fill="#21262d" stroke="#30363d"/><text x="804" y="172" class="m" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">UPDATE … WHERE stock &gt; 0</text><path d="M914 167h14m-5-5 5 5-5 5" fill="none" stroke="#8b949e" stroke-width="1.6"/><rect x="934" y="150" width="70" height="34" rx="8" fill="#11291a" stroke="#24683a"/><text x="969" y="172" class="m" font-size="13" font-weight="700" fill="#7ee787" text-anchor="middle">sold</text>
<text x="634" y="220" class="s" font-size="13" font-weight="600" fill="#8b949e" text-anchor="start">click 2</text><rect x="698" y="198" width="212" height="34" rx="8" fill="#21262d" stroke="#30363d"/><text x="804" y="220" class="m" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">UPDATE … WHERE stock &gt; 0</text><path d="M914 215h14m-5-5 5 5-5 5" fill="none" stroke="#8b949e" stroke-width="1.6"/><rect x="934" y="198" width="96" height="34" rx="8" fill="#11291a" stroke="#24683a"/><text x="982" y="220" class="m" font-size="13" font-weight="700" fill="#7ee787" text-anchor="middle">sold out</text>
<g><rect x="634" y="257" width="410.7" height="26" rx="13" fill="#11291a" stroke="#24683a"/><text x="645" y="274.68" class="s" font-size="13" font-weight="600" fill="#7ee787" text-anchor="start">✓ stock never below 0 · a retry gives the same order</text></g>
<text x="634" y="336" class="s" font-size="13" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="1.2">SPLIT $100.00 THREE WAYS</text>
