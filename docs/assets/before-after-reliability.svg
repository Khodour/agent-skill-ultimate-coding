<g><rect x="634" y="463" width="134.125" height="26" rx="13" fill="#11291a" stroke="#24683a"/><text x="645" y="480.68" class="s" font-size="13" font-weight="600" fill="#7ee787" text-anchor="start">✓ integer cents</text></g><g><rect x="778.125" y="463" width="149.075" height="26" rx="13" fill="#11291a" stroke="#24683a"/><text x="789.125" y="480.68" class="s" font-size="13" font-weight="600" fill="#7ee787" text-anchor="start">✓ one transaction</text></g><g><rect x="937.2" y="463" width="126.64999999999999" height="26" rx="13" fill="#11291a" stroke="#24683a"/><text x="948.2" y="480.68" class="s" font-size="13" font-weight="600" fill="#7ee787" text-anchor="start">✓ burst-tested</text></g>
