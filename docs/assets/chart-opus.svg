<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="t d">
<title id="t">Claude Opus 5.5: with and without the skill</title>
<desc id="d">Claude Opus 5.5, share of checks passed on 33 hard cases. All cases: 63% without the skill, 97% with it. Organized code (5 cases): 20% without, 100% with; Secure by default (5 cases): 60% without, 80% with; Reliable data (4 cases): 50% without, 100% with; Proven and honest (5 cases): 66% without, 97% with; Asks and plans first (4 cases): 35% without, 100% with; Right-sized (10 cases): 100% without, 100% with.</desc>
<style>
