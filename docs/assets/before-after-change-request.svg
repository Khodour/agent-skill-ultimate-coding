<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Coding blind on an existing project, then understanding it first</title>
<desc id="d">Without the skill: told to finish this project, the agent writes 14 files at once, rebuilds a login that already existed, guesses the export format, and 12 tests fail. With the skill: it reads the project and shows where it stands (done: login, cart, checkout; half-built: search without paging; missing: export), runs the tests (48 of 48 pass), asks two questions with recommendations, writes docs/change_requests/CR-001.md, and writes no code until the user confirms.</desc>
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .flow{stroke-dasharray:16 984;animation:flow 2.4s linear infinite}
  .lost{stroke-dasharray:22 978;animation:flow 7s linear infinite}
  @keyframes flow{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.2,1) backwards}
  @keyframes grow{from{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){.flow,.lost{animation:none;stroke-dasharray:none;opacity:0}.grow{animation:none}}</style>
<rect width="1200" height="560" rx="20" fill="#0d1117"/>

<rect x="20" y="20" width="570" height="520" rx="16" fill="#161b22" stroke="#30363d"/>
<circle cx="50" cy="51" r="5" fill="#f85149"/>
<text x="64" y="56" class="s" font-size="12" font-weight="700" fill="#f85149" text-anchor="start" letter-spacing="1.6">WITHOUT THE SKILL</text>
<text x="44" y="88" class="s" font-size="21" font-weight="700" fill="#e6edf3" text-anchor="start">Rewrites first, reads later.</text>
<rect x="610" y="20" width="570" height="520" rx="16" fill="#161b22" stroke="#30363d"/>
<circle cx="640" cy="51" r="5" fill="#3fb950"/>
<text x="654" y="56" class="s" font-size="12" font-weight="700" fill="#3fb950" text-anchor="start" letter-spacing="1.6">WITH THE SKILL</text>
<text x="634" y="88" class="s" font-size="21" font-weight="700" fill="#e6edf3" text-anchor="start">Reads the room before the code.</text><circle cx="600" cy="280" r="17" fill="#0d1117" stroke="#30363d"/><path d="M593 280h13m-5-5 5 5-5 5" fill="none" stroke="#e6edf3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="310" y="120" width="256" height="40" rx="12" fill="#1f2a37" stroke="#30363d"/>
<text x="326" y="149" class="s" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">Finish this project.</text>
<rect x="44" y="186" width="522" height="252" rx="12" fill="#0d1117" stroke="#30363d"/>
<path d="M44 220h522" stroke="#30363d"/>
<circle cx="62" cy="203" r="5" fill="#ff5f57" opacity=".85"/><circle cx="80" cy="203" r="5" fill="#febc2e" opacity=".85"/><circle cx="98" cy="203" r="5" fill="#28c840" opacity=".85"/>
<text x="305" y="208" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">claude</text>
<text x="64" y="244" class="m" font-size="14" xml:space="preserve"><tspan fill="#8b949e">Write  </tspan><tspan fill="#e6edf3">src/auth/login.js</tspan></text><g><rect x="300" y="226.5" width="180.7" height="25" rx="12.5" fill="#2d1517" stroke="#8e2c2a"/><text x="311" y="243.32" class="s" font-size="12" font-weight="600" fill="#ffa198" text-anchor="start">✕ login already existed</text></g>
<text x="64" y="270" class="m" font-size="14" xml:space="preserve"><tspan fill="#8b949e">Write  </tspan><tspan fill="#e6edf3">src/search/search.js</tspan></text>
<text x="64" y="296" class="m" font-size="14" xml:space="preserve"><tspan fill="#8b949e">Write  </tspan><tspan fill="#e6edf3">src/export/export.js</tspan></text><g><rect x="330" y="278.5" width="132.39999999999998" height="25" rx="12.5" fill="#2d1517" stroke="#8e2c2a"/><text x="341" y="295.32" class="s" font-size="12" font-weight="600" fill="#ffa198" text-anchor="start">✕ format guessed</text></g>
<text x="64" y="322" class="m" font-size="14" xml:space="preserve"><tspan fill="#8b949e">Edit   </tspan><tspan fill="#e6edf3">src/orders/orders.js</tspan></text>
<text x="64" y="348" class="m" font-size="14" xml:space="preserve"><tspan fill="#8b949e">       </tspan><tspan fill="#8b949e">… 10 more files</tspan></text>
<text x="64" y="396" class="m" font-size="14" xml:space="preserve"><tspan fill="#f85149">✗ </tspan><tspan fill="#ffa198">tests: 12 failed</tspan></text>
<g><rect x="44" y="457" width="186.45" height="26" rx="13" fill="#2d1517" stroke="#8e2c2a"/><text x="55" y="474.68" class="s" font-size="13" font-weight="600" fill="#ffa198" text-anchor="start">✕ rebuilt what existed</text></g><g><rect x="240.45" y="457" width="164.02499999999998" height="26" rx="13" fill="#2d1517" stroke="#8e2c2a"/><text x="251.45" y="474.68" class="s" font-size="13" font-weight="600" fill="#ffa198" text-anchor="start">✕ broke what worked</text></g>
<g><rect x="44" y="497" width="268.67499999999995" height="26" rx="13" fill="#2d1517" stroke="#8e2c2a"/><text x="55" y="514.68" class="s" font-size="13" font-weight="600" fill="#ffa198" text-anchor="start">✕ never asked what “finish” means</text></g>
<rect x="900" y="120" width="256" height="40" rx="12" fill="#1f2a37" stroke="#30363d"/>
<text x="916" y="149" class="s" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">Finish this project.</text>
<rect x="634" y="186" width="522" height="270" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="656" y="218" class="s" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Here is where the project stands</text>
<text x="660" y="252" class="s" font-size="16" font-weight="700" fill="#3fb950" text-anchor="start">✓</text><text x="684" y="252" class="s" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Done</text><text x="800" y="252" class="s" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">login, cart, checkout</text>
<text x="660" y="280" class="s" font-size="16" font-weight="700" fill="#d29922" text-anchor="start">◐</text><text x="684" y="280" class="s" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Half-built</text><text x="800" y="280" class="s" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">search: no paging</text>
<text x="660" y="308" class="s" font-size="16" font-weight="700" fill="#8b949e" text-anchor="start">○</text><text x="684" y="308" class="s" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Missing</text><text x="800" y="308" class="s" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">export</text>
<path d="M656 328h478" stroke="#30363d"/>
<text x="656" y="358" class="s" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Before I build:</text>
<text x="656" y="384" class="s" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">1. Export as CSV or Excel? (CSV recommended)</text>
<text x="656" y="410" class="s" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">2. Search: 20 results a page? (recommended)</text>
<text x="656" y="436" class="s" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Tests run: 48/48 pass today.</text>
<rect x="634" y="470" width="300" height="34" rx="8" fill="#11291a" stroke="#24683a"/>
<text x="648" y="492" class="m" font-size="13" font-weight="600" fill="#7ee787" text-anchor="start">docs/change_requests/CR-001.md</text>
<g><rect x="946" y="474.5" width="208.29999999999998" height="25" rx="12.5" fill="#11291a" stroke="#24683a"/><text x="957" y="491.32" class="s" font-size="12" font-weight="600" fill="#7ee787" text-anchor="start">✓ no code until you confirm</text></g>
</svg>
