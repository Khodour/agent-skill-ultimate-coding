<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="900" viewBox="0 0 1760 900" role="img" aria-labelledby="title desc">
  <title id="title">The 9 ways coding agents fail, and the guard Ultimate Coding puts on each</title>
  <desc id="desc">A hub labelled Ultimate Coding with nine spokes. Presentation &amp; UI: Look at the result like a user. State management: One source of truth, derived values. Data management: Parse at the edge, no bad states. APIs &amp; outside services: Never invent names, fields or keys. Business logic: Design card: edges and &quot;done when&quot;. Security &amp; access: 5 security MUSTs + check-diff. Repeated code: Reuse before inventing. Codebase awareness: Read and mirror the project first. Errors &amp; exceptions: No swallowed errors: fail loud.</desc>
  <!-- README diagram, drawn by a script: nine ways coding agents fail, each with this skill's guard. Adapts to light and dark mode. -->
  <style>
    .node.warm { fill: #F7E4D8; stroke: #C96A43; stroke-width: 2.5; }
    .node.cool { fill: #E7EEF7; stroke: #3D5A80; stroke-width: 2.5; }
    .hub  { fill: #FFFFFF; stroke: #C96A43; stroke-width: 4; }
    .hub2 { fill: none; stroke: #EADFD3; stroke-width: 10; }
    .spoke { stroke: #C9B8AA; stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
    .ic   { fill: none; stroke: #2A1712; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .ic.thin { stroke-width: 1.8; }
    .dot  { fill: #2A1712; }
    .warm .acc { fill: #E9A17C; stroke: #2A1712; stroke-width: 2; stroke-linejoin: round; }
    .cool .acc { fill: #9DB7D8; stroke: #2A1712; stroke-width: 2; stroke-linejoin: round; }
    .bad  { fill: none; stroke: #C0392B; stroke-width: 2.4; stroke-linecap: round; }
    .q    { fill: #2A1712; font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t    { fill: #2A1712; font: 700 27px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .g    { fill: #2F9E5B; font: 600 20px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1   { fill: #2A1712; font: 800 36px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h2   { fill: #C96A43; font: 700 16px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1px; }
    .src  { fill: #8A7A70; font: 400 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .node.warm { fill: #2A1C17; stroke: #E08A5F; }
      .node.cool { fill: #17212E; stroke: #7FA6D6; }
      .hub  { fill: #161B22; stroke: #E08A5F; }
      .hub2 { stroke: #30363D; }
      .spoke { stroke: #4A4F57; }
      .ic   { stroke: #F0F6FC; }
      .dot, .q { fill: #F0F6FC; }
      .warm .acc { fill: #8F4A2C; stroke: #F0F6FC; }
      .cool .acc { fill: #3B5B82; stroke: #F0F6FC; }
      .bad  { stroke: #FF7B72; }
      .t, .h1 { fill: #F0F6FC; }
      .g    { fill: #6FD49A; }
      .h2   { fill: #E08A5F; }
      .src  { fill: #9198A1; }
    }
  </style>
