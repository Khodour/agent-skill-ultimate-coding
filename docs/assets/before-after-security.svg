<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Injectable code, then safe code</title>
<desc id="d">Without the skill: an orders route that glues the id into SQL, logs the whole request body with the password, returns any customer's order with no access check, and keeps a key in the code; an attacker sending id 7 OR 1=1 gets every customer's orders. With the skill: the route asks for the order of this user only, denies with 404 by default, the query uses parameters, and the key comes from the environment; the same attack gets 404 Not Found.</desc>
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .flow{stroke-dasharray:16 984;animation:flow 2.4s linear infinite}
  .lost{stroke-dasharray:22 978;animation:flow 7s linear infinite}
  @keyframes flow{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.2,1) backwards}
  @keyframes grow{from{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){.flow,.lost{animation:none;stroke-dasharray:none;opacity:0}.grow{animation:none}}</style>
<rect width="1200" height="560" rx="20" fill="#0d1117"/>

<rect x="20" y="20" width="570" height="520" rx="16" fill="#161b22" stroke="#30363d"/>
<circle cx="50" cy="51" r="5" fill="#f85149"/>
<text x="64" y="56" class="s" font-size="12" font-weight="700" fill="#f85149" text-anchor="start" letter-spacing="1.6">WITHOUT THE SKILL</text>
<text x="44" y="88" class="s" font-size="21" font-weight="700" fill="#e6edf3" text-anchor="start">The front door is a suggestion.</text>
<rect x="610" y="20" width="570" height="520" rx="16" fill="#161b22" stroke="#30363d"/>
<circle cx="640" cy="51" r="5" fill="#3fb950"/>
<text x="654" y="56" class="s" font-size="12" font-weight="700" fill="#3fb950" text-anchor="start" letter-spacing="1.6">WITH THE SKILL</text>
<text x="634" y="88" class="s" font-size="21" font-weight="700" fill="#e6edf3" text-anchor="start">A bouncer checks every order.</text><circle cx="600" cy="280" r="17" fill="#0d1117" stroke="#30363d"/><path d="M593 280h13m-5-5 5 5-5 5" fill="none" stroke="#e6edf3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="44" y="110" width="522" height="300" rx="12" fill="#0d1117" stroke="#30363d"/>
<path d="M44 144h522" stroke="#30363d"/>
<circle cx="62" cy="127" r="5" fill="#ff5f57" opacity=".85"/><circle cx="80" cy="127" r="5" fill="#febc2e" opacity=".85"/><circle cx="98" cy="127" r="5" fill="#28c840" opacity=".85"/>
<text x="305" y="132" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">orders.js</text>
<text x="64" y="172" class="m" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">app</tspan><tspan fill="#6e7681">.get(</tspan><tspan fill="#a5d6ff">&quot;/orders/:id&quot;</tspan><tspan fill="#6e7681">, </tspan><tspan fill="#f0883e">async</tspan><tspan fill="#6e7681"> (req, res) =&gt; {</tspan></text>
<text x="64" y="198" class="m" font-size="14" xml:space="preserve"><tspan fill="#f0883e">  const</tspan><tspan fill="#e6edf3"> sql = </tspan><tspan fill="#a5d6ff">&quot;SELECT * FROM orders WHERE id = &quot;</tspan></text>
<rect x="46" y="209" width="3" height="20" fill="#f85149"/><text x="64" y="224" class="m" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">            + req.params.id;</tspan></text><g><rect x="340" y="206.5" width="173.79999999999998" height="25" rx="12.5" fill="#2d1517" stroke="#8e2c2a"/><text x="351" y="223.32" class="s" font-size="12" font-weight="600" fill="#ffa198" text-anchor="start">✕ input glued into SQL</text></g>
<text x="64" y="250" class="m" font-size="14" xml:space="preserve"><tspan fill="#f0883e">  const</tspan><tspan fill="#e6edf3"> rows = </tspan><tspan fill="#f0883e">await</tspan><tspan fill="#e6edf3"> db.query(sql);</tspan></text>
<rect x="46" y="261" width="3" height="20" fill="#f85149"/><text x="64" y="276" class="m" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  log.info(</tspan><tspan fill="#a5d6ff">&quot;checkout&quot;</tspan><tspan fill="#e6edf3">, req.body);</tspan></text><g><rect x="372" y="258.5" width="146.2" height="25" rx="12.5" fill="#2d1517" stroke="#8e2c2a"/><text x="383" y="275.32" class="s" font-size="12" font-weight="600" fill="#ffa198" text-anchor="start">✕ password in logs</text></g>
<rect x="46" y="287" width="3" height="20" fill="#f85149"/><text x="64" y="302" class="m" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  res.json(rows);</tspan></text><g><rect x="232" y="284.5" width="187.6" height="25" rx="12.5" fill="#2d1517" stroke="#8e2c2a"/><text x="243" y="301.32" class="s" font-size="12" font-weight="600" fill="#ffa198" text-anchor="start">✕ no check: is it yours?</text></g>
<text x="64" y="328" class="m" font-size="14" xml:space="preserve"><tspan fill="#6e7681">});</tspan></text>
<rect x="46" y="365" width="3" height="20" fill="#f85149"/><text x="64" y="380" class="m" font-size="14" xml:space="preserve"><tspan fill="#f0883e">const</tspan><tspan fill="#e6edf3"> PAY_KEY = </tspan><tspan fill="#a5d6ff">&quot;hard-coded-key&quot;</tspan><tspan fill="#6e7681">;</tspan></text><g><rect x="388" y="362.5" width="104.8" height="25" rx="12.5" fill="#2d1517" stroke="#8e2c2a"/><text x="399" y="379.32" class="s" font-size="12" font-weight="600" fill="#ffa198" text-anchor="start">✕ key in git</text></g>
<rect x="44" y="426" width="522" height="92" rx="12" fill="#0d1117" stroke="#30363d"/>
<path d="M44 460h522" stroke="#30363d"/>
<circle cx="62" cy="443" r="5" fill="#ff5f57" opacity=".85"/><circle cx="80" cy="443" r="5" fill="#febc2e" opacity=".85"/><circle cx="98" cy="443" r="5" fill="#28c840" opacity=".85"/>
<text x="305" y="448" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">attacker</text>
<text x="64" y="486" class="m" font-size="15" xml:space="preserve"><tspan fill="#e6edf3">GET /orders/7 OR 1=1</tspan></text>
<text x="546" y="487" class="s" font-size="14" font-weight="700" fill="#ffa198" text-anchor="end">200 OK · every customer's orders</text>
<rect x="634" y="110" width="522" height="300" rx="12" fill="#0d1117" stroke="#30363d"/>
<path d="M634 144h522" stroke="#30363d"/>
<circle cx="652" cy="127" r="5" fill="#ff5f57" opacity=".85"/><circle cx="670" cy="127" r="5" fill="#febc2e" opacity=".85"/><circle cx="688" cy="127" r="5" fill="#28c840" opacity=".85"/>
<text x="895" y="132" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">orders.js · orders.repo.js</text>
<text x="654" y="172" class="m" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">app</tspan><tspan fill="#6e7681">.get(</tspan><tspan fill="#a5d6ff">&quot;/orders/:id&quot;</tspan><tspan fill="#6e7681">, </tspan><tspan fill="#f0883e">async</tspan><tspan fill="#6e7681"> (req, res) =&gt; {</tspan></text>
<text x="654" y="198" class="m" font-size="14" xml:space="preserve"><tspan fill="#f0883e">  const</tspan><tspan fill="#e6edf3"> order = </tspan><tspan fill="#f0883e">await</tspan><tspan fill="#e6edf3"> orders.findForUser(</tspan></text>
<rect x="636" y="209" width="3" height="20" fill="#3fb950"/><text x="654" y="224" class="m" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">    req.params.id, req.user.id);</tspan></text><g><rect x="944" y="206.5" width="104.8" height="25" rx="12.5" fill="#11291a" stroke="#24683a"/><text x="955" y="223.32" class="s" font-size="12" font-weight="600" fill="#7ee787" text-anchor="start">✓ yours only</text></g>
<rect x="636" y="235" width="3" height="20" fill="#3fb950"/><text x="654" y="250" class="m" font-size="14" xml:space="preserve"><tspan fill="#f0883e">  if</tspan><tspan fill="#e6edf3"> (!order) </tspan><tspan fill="#f0883e">return</tspan><tspan fill="#e6edf3"> res.sendStatus(404);</tspan></text><g><rect x="1015" y="232.5" width="63.4" height="25" rx="12.5" fill="#11291a" stroke="#24683a"/><text x="1026" y="249.32" class="s" font-size="12" font-weight="600" fill="#7ee787" text-anchor="start">✓ deny</text></g>
<text x="654" y="276" class="m" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  res.json(order);</tspan></text>
<text x="654" y="302" class="m" font-size="14" xml:space="preserve"><tspan fill="#6e7681">});</tspan></text>
<rect x="636" y="313" width="3" height="20" fill="#3fb950"/><text x="654" y="328" class="m" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">db.query(</tspan><tspan fill="#a5d6ff">&quot;… WHERE id = $1 AND owner_id = $2&quot;</tspan><tspan fill="#6e7681">,</tspan></text>
<text x="654" y="354" class="m" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">         [id, userId]);</tspan></text><g><rect x="900" y="336.5" width="146.2" height="25" rx="12.5" fill="#11291a" stroke="#24683a"/><text x="911" y="353.32" class="s" font-size="12" font-weight="600" fill="#7ee787" text-anchor="start">✓ input stays data</text></g>
<rect x="636" y="365" width="3" height="20" fill="#3fb950"/><text x="654" y="380" class="m" font-size="14" xml:space="preserve"><tspan fill="#f0883e">const</tspan><tspan fill="#e6edf3"> PAY_KEY = process.env.PAY_KEY;</tspan></text><g><rect x="990" y="362.5" width="91" height="25" rx="12.5" fill="#11291a" stroke="#24683a"/><text x="1001" y="379.32" class="s" font-size="12" font-weight="600" fill="#7ee787" text-anchor="start">✓ from env</text></g>
<rect x="634" y="426" width="522" height="92" rx="12" fill="#0d1117" stroke="#30363d"/>
<path d="M634 460h522" stroke="#30363d"/>
<circle cx="652" cy="443" r="5" fill="#ff5f57" opacity=".85"/><circle cx="670" cy="443" r="5" fill="#febc2e" opacity=".85"/><circle cx="688" cy="443" r="5" fill="#28c840" opacity=".85"/>
<text x="895" y="448" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">attacker</text>
<text x="654" y="486" class="m" font-size="15" xml:space="preserve"><tspan fill="#e6edf3">GET /orders/7 OR 1=1</tspan></text>
<text x="1136" y="487" class="s" font-size="14" font-weight="700" fill="#7ee787" text-anchor="end">404 Not Found</text>
</svg>
