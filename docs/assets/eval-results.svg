<svg xmlns="http://www.w3.org/2000/svg" width="900" height="536" viewBox="0 0 900 536" role="img" aria-labelledby="title desc">
<title id="title">Eval pass rates without and with the skill</title>
<desc id="desc">Claude Haiku 5.5: Fixes a query inside a loop it edits 0% to 100%, Bug fix comes with a reproducing test 20% to 100%, Order code is safe against double submits 0% to 100%, Queries from user input stay parameterized 20% to 100%, A failed cart read keeps the saved cart 80% to 100%, A coupon is used once, even under races 0% to 40%, A bill split adds up exactly to the total 0% to 33%; Claude Code default model: Bug fix comes with a reproducing test 0% to 100%, A bill split adds up exactly to the total 33% to 100%, Order code is safe against double submits 67% to 100%, Runs the tests before calling a fix done 67% to 100%</desc>
<!-- README chart, generated: pass rate per behaviour, without (orange) and with the skill (blue); a full pass is marked in green. -->
<style>
  .head   { fill: #0b0b0b; font: 700 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .sub    { fill: #52514e; font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .panel  { fill: #0b0b0b; font: 600 13.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .label  { fill: #0b0b0b; font: 400 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .value  { fill: #52514e; font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .strong { fill: #0b0b0b; font-weight: 700; }
  .pass   { fill: #006300; font-weight: 700; }
  .pass-bg { fill: #0ca30c; fill-opacity: 0.12; }
  .tick   { fill: #898781; font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .legend { fill: #52514e; font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .grid   { stroke: #e1e0d9; stroke-width: 1; }
  .accent { fill: #2a78d6; }
  .gain   { stroke-width: 3; stroke-linecap: round; }
  .g0 { stop-color: #eb6834; stop-opacity: 0.55; }
  .g1 { stop-color: #2a78d6; stop-opacity: 0.55; }
  .without { fill: #eb6834; stroke: #ffffff; stroke-width: 2; }
  .with    { fill: #2a78d6; stroke: #ffffff; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .head, .panel, .label, .strong { fill: #f0efec; }
    .sub, .value, .legend { fill: #c3c2b7; }
    .pass   { fill: #0ca30c; }
    .pass-bg { fill-opacity: 0.18; }
    .grid   { stroke: #2c2c2a; }
    .accent { fill: #3987e5; }
    .g0 { stop-color: #d95926; }
    .g1 { stop-color: #3987e5; }
    .without { fill: #d95926; stroke: #0d1117; }
    .with    { fill: #3987e5; stroke: #0d1117; }
  }
</style>
