<title id="t">Claude Sonnet 5.5: with and without the skill</title>
<desc id="d">Claude Sonnet 5.5, share of checks passed on 33 hard cases. All cases: 60% without the skill, 99% with it. Organized code (5 cases): 0% without, 100% with; Secure by default (5 cases): 60% without, 100% with; Reliable data (4 cases): 59% without, 100% with; Proven and honest (5 cases): 48% without, 92% with; Asks and plans first (4 cases): 54% without, 100% with; Right-sized (10 cases): 99% without, 100% with.</desc>
