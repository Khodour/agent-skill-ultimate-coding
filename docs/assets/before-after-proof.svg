<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">A claim without proof, then a proven fix with an honest report</title>
<desc id="d">Without the skill: asked to fix the checkout total, the agent says Fixed, everything works, with no test run and the cause not found; two days later production throws TypeError total is NaN because the coupon was applied twice. With the skill: a test that fails today, the cause fixed in cart/total.js, tests 42 of 42 and the build after the last edit, a red line saying it was not tried in the browser yet, medium confidence with the reason, and numbered options to reach high.</desc>
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .flow{stroke-dasharray:16 984;animation:flow 2.4s linear infinite}
  .lost{stroke-dasharray:22 978;animation:flow 7s linear infinite}
  @keyframes flow{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.2,1) backwards}
  @keyframes grow{from{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){.flow,.lost{animation:none;stroke-dasharray:none;opacity:0}.grow{animation:none}}</style>
