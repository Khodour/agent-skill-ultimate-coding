<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Without the skill: spaghetti code. With the skill: organized code.</title>
  <desc id="d">Left panel: code that works but is tangled, with lines crossing between a route, SQL built from input, nested ifs, copied code, a secret in the code and a TODO, and warnings for injection, no tests and breaking on retry. Right panel: the same feature organized in three layers, route, service and data, with tests, security checks, safe retries and proof before it is called done.</desc>
  <defs>
    <style>
      .panel { fill: #111827; }
      .title { font: 700 30px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub   { font: 500 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #cbd5e1; }
      .box   { fill: #1f2937; stroke: #374151; stroke-width: 2; }
      .lbl   { font: 600 16px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #e5e7eb; }
      .small { font: 500 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .warn  { fill: #3b1d1d; stroke: #f87171; stroke-width: 1.5; }
      .warnt { font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #fca5a5; }
      .ok    { fill: #12301f; stroke: #4ade80; stroke-width: 1.5; }
      .okt   { font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #86efac; }
      .layer { fill: #172033; stroke: #60a5fa; stroke-width: 2; }
      .layt  { font: 700 18px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e5e7eb; }
      .noodle { fill: none; stroke-width: 4; stroke-linecap: round; opacity: .9; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- LEFT: without the skill -->
  <rect class="panel" x="10" y="10" width="580" height="540" rx="18"/>
  <text class="title" x="40" y="58" fill="#f87171">Without the skill</text>
  <text class="sub" x="40" y="88">It works. It's spaghetti.</text>

  <path class="noodle" stroke="#fbbf24" d="M95 150 C 260 105, 120 330, 330 250 S 520 120, 470 330 S 210 460, 140 360"/>
  <path class="noodle" stroke="#f472b6" d="M480 150 C 300 250, 520 330, 260 300 C 120 280, 70 220, 170 350 C 230 440, 430 450, 520 400"/>
  <path class="noodle" stroke="#60a5fa" d="M110 255 C 220 150, 380 420, 430 220 S 300 120, 180 200 S 330 440, 470 450"/>
  <path class="noodle" stroke="#34d399" d="M300 140 C 140 220, 520 260, 330 370 S 90 300, 130 455"/>
  <path class="noodle" stroke="#a78bfa" d="M520 260 C 400 140, 160 420, 300 440 S 520 250, 360 180"/>

  <rect class="box" x="45" y="128" width="110" height="38" rx="8"/><text class="lbl" x="62" y="153">route()</text>
  <rect class="box" x="400" y="128" width="160" height="38" rx="8"/><text class="lbl" x="414" y="153">"SQL" + input</text>
  <rect class="box" x="55" y="236" width="140" height="38" rx="8"/><text class="lbl" x="68" y="261">if/else × 9</text>
  <rect class="box" x="380" y="208" width="170" height="38" rx="8"/><text class="lbl" x="394" y="233">copy-paste #3</text>
  <rect class="box" x="215" y="320" width="190" height="38" rx="8"/><text class="lbl" x="229" y="345">key = "s3cr3t"</text>
  <rect class="box" x="60" y="412" width="190" height="38" rx="8"/><text class="lbl" x="74" y="437">// TODO fix later</text>
  <rect class="box" x="395" y="420" width="150" height="38" rx="8"/><text class="lbl" x="410" y="445">"fixed" ✓?</text>

  <rect class="warn" x="40" y="490" width="150" height="36" rx="18"/><text class="warnt" x="62" y="514">! SQL injection</text>
  <rect class="warn" x="205" y="490" width="120" height="36" rx="18"/><text class="warnt" x="228" y="514">! no tests</text>
  <rect class="warn" x="340" y="490" width="215" height="36" rx="18"/><text class="warnt" x="362" y="514">! breaks on a retry</text>

  <!-- RIGHT: with the skill -->
  <rect class="panel" x="610" y="10" width="580" height="540" rx="18"/>
  <text class="title" x="640" y="58" fill="#4ade80">With the skill</text>
  <text class="sub" x="640" y="88">It works. It's organized, secure and proven.</text>

  <rect class="layer" x="640" y="125" width="300" height="78" rx="12"/>
  <text class="layt" x="662" y="158">Route</text>
  <text class="small" x="662" y="184">reads input, calls the rule</text>
  <line x1="790" y1="205" x2="790" y2="240" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="layer" x="640" y="245" width="300" height="78" rx="12"/>
  <text class="layt" x="662" y="278">Service</text>
  <text class="small" x="662" y="304">business rules in one place</text>
  <line x1="790" y1="325" x2="790" y2="360" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="layer" x="640" y="365" width="300" height="78" rx="12"/>
  <text class="layt" x="662" y="398">Data</text>
  <text class="small" x="662" y="424">safe queries, all-or-nothing</text>

  <rect class="ok" x="965" y="135" width="200" height="40" rx="20"/><text class="okt" x="990" y="161">✓ Tests for the logic</text>
  <rect class="ok" x="965" y="190" width="200" height="40" rx="20"/><text class="okt" x="990" y="216">✓ Input stays data</text>
  <rect class="ok" x="965" y="245" width="200" height="40" rx="20"/><text class="okt" x="990" y="271">✓ Access checked</text>
  <rect class="ok" x="965" y="300" width="200" height="40" rx="20"/><text class="okt" x="990" y="326">✓ Safe to retry</text>
  <rect class="ok" x="965" y="355" width="200" height="40" rx="20"/><text class="okt" x="990" y="381">✓ Secrets out of code</text>
  <rect class="ok" x="965" y="410" width="200" height="40" rx="20"/><text class="okt" x="990" y="436">✓ Builds on what exists</text>

  <rect class="ok" x="640" y="490" width="525" height="36" rx="18"/>
  <text class="okt" x="662" y="514">✓ Proven before it is called done, and honest about what is not</text>
</svg>
