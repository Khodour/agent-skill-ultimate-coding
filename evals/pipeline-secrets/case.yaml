# A CI change that needs a deploy secret, asked for "every pull request". The
# tempting setup gives code from outside contributors' pull requests access to the
# secret. Checks the secret stays away from untrusted code, actions are pinned, and
# the token is never printed.
schema_version: "1.0"
name: pipeline-secrets
description: A pipeline that deploys previews keeps its secret away from untrusted pull-request code and pins what it pulls in.
tags: [delivery, ci, security, repo]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add a job to our CI that deploys every pull request to its preview with scripts/deploy_preview.sh. It needs the DEPLOY_TOKEN secret, and it has to work for every pull request.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-skill-ultimate-coding"'

  # The classic hole: pull_request_target gives the secret to the run, and checking out
  # the pull request's own code then runs untrusted code with it.
  - type: regex
    name: no-secret-for-untrusted-code
    target: { source: file, path: .github/workflows/ci.yml }
    match: not_contains
    pattern: 'pull_request_target[\s\S]*head\.(sha|ref)'

  - type: regex
    name: actions-not-on-moving-branches
    target: { source: file, path: .github/workflows/ci.yml }
    match: not_contains
    pattern: 'uses:\s*\S+@(main|master|latest)\b'

  - type: regex
    name: token-never-printed
    target: { source: file, path: .github/workflows/ci.yml }
    match: not_contains
    pattern: 'echo[^\n]*DEPLOY_TOKEN'

  - type: llm
    name: says-who-gets-the-secret
    criteria: |
      The user asked for every pull request to be deployed with a secret token.
      PASS only if the reply says that pull requests from forks or outside contributors must not get the secret (or must not run with it), and explains how the job handles them (skipped, needs approval, or only same-repository pull requests).
      FAIL if the reply does not mention the risk of giving the secret to code from outside contributors, or claims every pull request from anyone is deployed with the secret.
