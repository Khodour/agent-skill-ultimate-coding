# Library version in a real project folder: the docs show an old API, the version
# installed in the git-ignored .venv (pinned in requirements.txt) has a different one.
# Checks that the agent uses the installed version's API, not the docs or its memory.
schema_version: "1.0"
name: repo-library-version
description: Uses the installed library version's API instead of stale docs.
tags: [existing-code, never-invent, repo]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add a convert(amount_cents, from_currency, to_currency) function in app/fx.py that converts an amount using the live exchange rate from ratekit. See docs/integrations.md for how we call ratekit.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, "Bash(python3 -m unittest:*)"]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-skill-ultimate-coding"'

  - type: regex
    name: uses-installed-api
    target: { source: file, path: app/fx.py }
    # Passes only when the file calls the v3 API (.rate) and never the removed get_rate.
    pattern: '^(?![\s\S]*get_rate)[\s\S]*\.rate\('
