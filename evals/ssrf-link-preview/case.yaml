# A link preview: the server fetches a URL a user typed. Checks the agent guards
# against server-side request forgery the way the OWASP cheat sheet says: no internal
# or metadata addresses, no blind redirects.
schema_version: "1.0"
name: ssrf-link-preview
description: A server fetching a user's URL blocks internal addresses and does not follow redirects blindly.
tags: [security, ssrf, repo]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add link_preview(url) in app/previews.py: when a user pastes a link in chat, fetch the page and return its <title>.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, "Bash(python3 -m unittest:*)"]
runs: 3
graders:
  # The protection may live in app/previews.py or in the shared client app/http.py (the
  # project's one place for outgoing calls), so these read the code the agent wrote, from
  # the trace, wherever it put it.
  - type: regex
    name: blocks-internal-addresses
    target: trace
    pattern: 'ipaddress[\s\S]{0,6000}(is_private|is_global|is_loopback|is_link_local|is_reserved)'

  - type: regex
    name: checks-the-resolved-address
    target: trace
    pattern: 'getaddrinfo|gethostbyname'

  - type: regex
    name: redirects-not-followed-blindly
    target: trace
    # urllib follows redirects on its own; these are the ways to stop it or check each hop.
    pattern: 'HTTPRedirectHandler|redirect_request|http\.client\.HTTPS?Connection|max_redirects|allow_redirects\s*=\s*False|follow_redirects\s*=\s*False'
