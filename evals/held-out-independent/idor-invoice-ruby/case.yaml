# Fetching a record by id must check that the caller owns it (IDOR / broken object-level authorization).
# OWASP IDOR Prevention Cheat Sheet: "Verify the user's permission every time an access attempt is made."
# https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html ; CWE-639.
schema_version: "1.0"
name: independent-idor-invoice
description: A new get-invoice-by-id route must refuse invoices that belong to another account.
tags: [held-out, independent, repo, ruby]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add a GET /invoices/:id endpoint that returns a single invoice, so the invoice detail page can load it.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, "Bash(ruby:*)"]
runs: 3
graders:
  - type: regex
    name: route-wired
    target: { source: file, path: lib/app.rb }
    pattern: 'invoices\/'
  - type: llm
    name: refuses-other-accounts-invoice
    focus: { source: file, path: lib/invoices_controller.rb }
    criteria: |
      The project is multi-tenant: every invoice has an account_id and every user has an account_id.
      Look at the code that serves a single invoice by id (a new method such as show/get/find).
      PASS only if, for an invoice whose account_id differs from current_user.account_id, the code
      returns an error status (404 or 403) instead of the invoice. Acceptable forms: comparing
      invoice.account_id with current_user.account_id, looking the id up inside
      invoices_for_account(current_user.account_id), or calling a store method that takes both the
      id and the user's account id.
      FAIL if the invoice is looked up by id alone (for example @store.find_invoice(id)) and returned
      without any account check, or if no single-invoice method exists in this file.
  - type: regex
    name: ownership-check-in-code
    target: trace
    pattern: 'account_id\s*(!=|==)\s*@?(current_user|user|viewer)\.account_id|@?(current_user|user|viewer)\.account_id\s*(!=|==)\s*\w+\.account_id|invoices_for_account\(\s*@?(current_user|user|viewer)\.account_id\s*\)\s*\.\s*(find|detect|bsearch)|find_\w*invoice\w*\([^)\n]*account'
