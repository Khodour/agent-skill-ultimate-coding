# The project builds SQL with string formatting (safe only because it casts to int). A new free-text search
# must bind the user's text as a query parameter instead of copying that style.
# OWASP SQL Injection Prevention Cheat Sheet, Defense Option 1 (prepared statements / parameterized queries);
# https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html ; CWE-89.
schema_version: "1.0"
name: independent-sql-search
description: A new text search over customers must use bound parameters, not string-built SQL.
tags: [held-out, independent, repo, python]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Support staff need to find orders by part of a customer's name or email. Add a search for that and expose it as a CLI command.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, "Bash(python3 -m unittest:*)", "Bash(python3 -m orders_app.cli:*)"]
runs: 3
graders:
  - type: regex
    name: search-text-not-interpolated
    target: trace
    match: not_contains
    # Matches the user's text pasted inside a quoted SQL literal: f-string, % formatting, .format or + concatenation.
    # Reads only code the agent wrote (Write/Edit inputs in the trace), never files or skill text it read.
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{[^\n]*?"(?:new_string|content)":"(?:[^"\\]|\\.)*?(?:(\bLIKE|=)\s*''%*(\{[^}\n]*\}|%s|"\s*\+)|(\bLIKE|=)\s*''%*[^''\n]*''["'']\s*(%|\.format))'
  - type: regex
    name: search-uses-bound-parameter
    target: trace
    pattern: '\bLIKE\s+((lower|LOWER|upper|UPPER)\(\s*)?(''%''\s*\|\|\s*)?(\?|:[a-z_]\w*)|\b(instr|INSTR)\([^\n]{0,60}?,\s*((lower|LOWER)\(\s*)?(\?|:[a-z_]\w*)'
