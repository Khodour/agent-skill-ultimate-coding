# A Small task: one pure function beside its siblings. Checks the skill stays light:
# it reads at most two of its reference files and ends with a short report.
schema_version: "1.0"
name: no-overprocess-small
description: A small pure function reads few reference files and ends with a short report.
tags: [misfire, cost, repo, rule-sizing, rule-report]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add slugify(title) to text_utils: lowercase, words joined with "-", only a-z and 0-9 kept.
  # Turn budget: about twice what the task takes without the skill (5–6 turns), so
  # over-process fails the case instead of passing quietly.
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, "Bash(python3 -m unittest:*)"]
runs: 3
graders:
  - type: regex
    name: function-added
    target: { source: file, path: text_utils.py }
    pattern: 'def slugify\('

  - type: tool_used
    name: reads-few-references
    tool: Read
    input_match: 'agent-skill-ultimate-coding/references/'
    min: 0
    max: 2

  - type: regex
    name: short-report
    target: last_message
    pattern: '^[\s\S]{0,1400}$'
