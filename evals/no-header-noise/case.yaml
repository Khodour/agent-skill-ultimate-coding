# A one-line fix (a wrong coupon rate) in a legacy module with no docstrings or
# comments. Checks the change stays focused: the rate is fixed, a test is added, and
# no headers or comments are sprinkled over code the task did not touch.
schema_version: "1.0"
name: no-header-noise
description: A one-line fix in legacy code stays one line, without headers added everywhere.
tags: [scope, comments, repo, gaps]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The SAVE20 coupon only takes 10% off; it should take 20%. Please fix it.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, "Bash(python3 -m unittest:*)"]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-skill-ultimate-coding"'

  - type: regex
    name: rate-fixed
    target: { source: file, path: shop/legacy_pricing.py }
    pattern: '"SAVE20":\s*Decimal\("0\.20?"\)'

  - type: llm
    name: no-header-noise
    focus: { source: file, path: shop/legacy_pricing.py }
    criteria: |
      Originally this file had no module docstring, no function docstrings and no comments. The task only needed the SAVE20 rate changed from 0.10 to 0.20 in COUPONS.
      PASS if the file has no new module docstring, no new docstrings on functions, and no new comments, except at most one short comment next to the changed COUPONS line.
      FAIL if a module docstring, any function docstring, or comments elsewhere were added, or unrelated code was reformatted or rewritten.
