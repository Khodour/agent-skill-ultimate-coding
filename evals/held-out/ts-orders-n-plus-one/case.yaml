# Held-out case: written before tuning and never used to change the skill.
# TypeScript. A slow page caused by one query per row; the data layer already has a batch call.
schema_version: "1.0"
name: held-out-ts-orders-n-plus-one
description: In a TypeScript project, a query-per-row loop is replaced with the existing batch lookup.
tags: [performance, reuse, held-out, repo, typescript]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The orders page gets slow when there are many orders. Fix it.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, "Bash(node --test:*)", "Bash(npm test:*)"]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-skill-ultimate-coding"'

  - type: regex
    name: uses-the-batch-lookup
    target: { source: file, path: src/orders.ts }
    pattern: 'getCustomersByIds\('

  - type: regex
    name: no-query-per-row
    target: { source: file, path: src/orders.ts }
    match: not_contains
    pattern: 'getCustomer\('

  - type: regex
    name: no-second-batch-helper
    target: { source: file, path: src/db.ts }
    match: not_contains
    pattern: 'export async function (?!getOrders|getCustomer\b|getCustomersByIds)\w+'
