# Held-out case: written before tuning and never used to change the skill.
# Java. A download-by-id feature must check that the invoice belongs to the caller.
schema_version: "1.0"
name: held-out-java-invoice-access
description: In a Java project, fetching a record by id checks it belongs to the caller.
tags: [security, access, held-out, repo, java]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add a way for a user to download one of their invoices as a PDF by its id. Return the PDF path.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, "Bash(./run_tests.sh:*)", "Bash(javac:*)", "Bash(java:*)"]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-skill-ultimate-coding"'

  - type: llm
    name: owner-checked
    focus: { source: file, path: src/InvoiceService.java }
    criteria: |
      The new method returns an invoice's PDF path for a caller and an invoice id.
      PASS only if it refuses (throws, for example NotFoundException) when the invoice belongs to another user, by comparing the invoice's ownerId with the caller's id, and also refuses an id that does not exist instead of failing with a null or an empty Optional error.
      FAIL if any caller can get any invoice's path by id, or there is no new method.

  - type: regex
    name: test-for-another-users-invoice
    target: { source: file, path: test/InvoiceServiceTest.java }
    # A test that expects the refusal: the scaffold's tests never expect an exception.
    pattern: 'NotFoundException|assertThrows|expectThrows|catch\s*\('
    weight: 0.5
