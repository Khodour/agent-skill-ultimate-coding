# Held-out case: written before tuning and never used to change the skill.
# Ruby. Splitting a total between people: integer cents, and the shares add up exactly.
schema_version: "1.0"
name: held-out-ruby-split-bill
description: In a Ruby project, splitting money keeps integer cents and the parts add up exactly to the total.
tags: [correctness, money, held-out, repo, ruby]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add a way to split a receipt's total evenly between a number of people, so each person sees what they owe.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, "Bash(ruby:*)"]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-skill-ultimate-coding"'

  - type: regex
    name: no-floats
    target: { source: file, path: lib/receipt.rb }
    match: not_contains
    pattern: '\.to_f\b|\.round\(|\bFloat\b|\d\.\d|fdiv'

  - type: llm
    name: shares-add-up
    focus: { source: file, path: lib/receipt.rb }
    criteria: |
      A new method splits the receipt's total_cents between n people.
      PASS only if the shares are integers and always add up exactly to the total (the leftover cents from the division go to some of the people by a clear rule), and a count below 1 is rejected with an error.
      FAIL if every share is the same rounded amount so the sum can differ from the total, or a count of 0 divides by zero.
