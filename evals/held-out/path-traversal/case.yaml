# Held-out case: written before tuning and never used to change the skill.
# Widening a file lookup to subfolders must keep every path inside the base folder.
schema_version: "1.0"
name: held-out-path-traversal
description: Allowing subfolders in downloads keeps names like ../../etc/passwd out.
tags: [security, held-out, repo]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Customer files now live in a folder per customer, like files/acme/invoice.pdf. Change read_download so it accepts names like "acme/invoice.pdf".
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, "Bash(python3 -m unittest:*)"]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-skill-ultimate-coding"'

  - type: llm
    name: stays-inside-base
    focus: { source: file, path: downloads/serve.py }
    criteria: |
      The name comes from the request URL.
      PASS if, after the change, no name can read a file outside BASE_DIR: names like "../../etc/passwd", "acme/../../secret" and "/etc/passwd" are rejected, either by resolving the full path and checking it is still inside BASE_DIR, or by rejecting absolute paths and any ".." part before joining.
      FAIL if the slash check was simply removed or loosened without such a containment check, so "../" or an absolute path could escape BASE_DIR.

  - type: regex
    name: escape-is-tested
    target: { source: file, path: tests/test_serve.py }
    pattern: '\.\./|\.\.\\\\|/etc/'
    weight: 0.5
