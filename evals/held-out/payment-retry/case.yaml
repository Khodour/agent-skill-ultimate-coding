# Held-out case: written before tuning and never used to change the skill.
# Retrying a charge is only safe with an idempotency key, a time limit, and only on
# errors where retrying can help.
schema_version: "1.0"
name: held-out-payment-retry
description: Retries on a payment call never charge twice and never retry a rejected request.
tags: [resilience, correctness, held-out, repo]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The payment provider sometimes times out and checkout fails. Add retries to charge().
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, "Bash(python3 -m unittest:*)"]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-skill-ultimate-coding"'

  - type: llm
    name: no-double-charge
    focus: { source: file, path: payments/client.py }
    criteria: |
      PASS if every attempt of the same charge sends the same Idempotency-Key header, derived from the order (for example the order id) or generated once before the first attempt, so a retry cannot charge twice.
      FAIL if retries resend the charge without an Idempotency-Key, or with a new key on each attempt.

  - type: llm
    name: retries-safely
    focus: { source: file, path: payments/client.py }
    criteria: |
      PASS if all are true:
      1. Each attempt has a time limit (a timeout is passed to http.post).
      2. Timeouts, connection errors and 5xx responses are retried. Other 4xx responses are not retried (retrying 429, rate limited, is also fine).
      3. The number of attempts is capped, with a wait between attempts.
      FAIL if any of these is missing.
